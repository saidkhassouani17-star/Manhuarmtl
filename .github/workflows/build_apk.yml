name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: unzip -o madomi_full_stack_kaggle.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter Android Project
        run: |
          cd flutter_app
          flutter create . --platforms=android
          # مسح سطر package لتوافق Gradle الحديث
          sed -i 's/package="[^"]*"//g' android/app/src/main/AndroidManifest.xml
          # ترقية compileSdk إلى 35
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle || true
          flutter pub get

      - name: Build Android APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madomi-AI-Reader-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
